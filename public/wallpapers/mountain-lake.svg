<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="100%" height="100%">
  <defs>
    <linearGradient id="lakeSky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#3A5364" />
      <stop offset="50%" stop-color="#607D8B" />
      <stop offset="85%" stop-color="#A7BDC5" />
      <stop offset="100%" stop-color="#E1EBEB" />
    </linearGradient>
    <linearGradient id="lakeWater" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#557582" />
      <stop offset="40%" stop-color="#314B57" />
      <stop offset="100%" stop-color="#192A32" />
    </linearGradient>
  </defs>

  <rect width="1920" height="640" fill="url(#lakeSky)" />
  <rect y="640" width="1920" height="440" fill="url(#lakeWater)" />

  <!-- Alpine Mountain Ridges -->
  <polygon points="100,640 420,240 680,640" fill="#3B505C" />
  <polygon points="420,240 500,320 680,640" fill="#2E404B" />
  <polygon points="480,640 850,180 1250,640" fill="#4B6370" />
  <polygon points="850,180 980,300 1250,640" fill="#384C57" />
  <polygon points="1100,640 1450,260 1780,640" fill="#3B505C" />
  <polygon points="1450,260 1560,350 1780,640" fill="#2B3C46" />

  <!-- Snow Caps -->
  <polygon points="420,240 370,300 420,320 460,280" fill="#EEF4F6" opacity="0.9" />
  <polygon points="850,180 780,260 840,280 890,270 940,240" fill="#EEF4F6" opacity="0.95" />
  <polygon points="1450,260 1400,330 1460,340 1510,310" fill="#EEF4F6" opacity="0.9" />

  <!-- Water Reflection Mirroring Mountain Shadows -->
  <g opacity="0.35">
    <polygon points="480,640 850,960 1250,640" fill="#2C3D46" />
    <polygon points="100,640 420,910 680,640" fill="#223138" />
    <polygon points="1100,640 1450,920 1780,640" fill="#223138" />
  </g>

  <!-- Water Ripples -->
  <g stroke="#91AAB5" stroke-width="2" opacity="0.4">
    <line x1="200" y1="680" x2="450" y2="680" />
    <line x1="600" y1="710" x2="950" y2="710" />
    <line x1="1200" y1="690" x2="1550" y2="690" />
    <line x1="350" y1="760" x2="720" y2="760" />
    <line x1="850" y1="790" x2="1300" y2="790" />
    <line x1="500" y1="880" x2="1100" y2="880" />
  </g>

  <!-- Shoreline Forest Foreground -->
  <path d="M0,880 Q400,820 900,860 T1920,830 L1920,1080 L0,1080 Z" fill="#132128" />
  <g fill="#0B151A">
    <polygon points="60,940 110,540 160,940" />
    <polygon points="100,950 150,490 200,950" />
    <polygon points="150,960 190,580 230,960" />
    <polygon points="1720,930 1770,510 1820,930" />
    <polygon points="1780,950 1830,470 1880,950" />
  </g>

  <!-- Cozy Dawn Sun Glow -->
  <circle cx="850" cy="380" r="300" fill="#FFEAD1" opacity="0.18" />
</svg>
